<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PixVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/popupable@1.11.0/dist/popupable.min.css" rel="stylesheet">
<style>

  :root {
    --bg:        #0a0a0f;
    --surface:   #13131a;
    --border:    #1e1e2e;
    --accent:    #7c6af7;
    --accent2:   #e06c8b;
    --text:      #e2e2ef;
    --muted:     #6b6b80;
    --radius:    10px;
    --gap:       10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  .sort-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: .3rem .6rem;
    border-radius: 8px;
    font-size: .8rem;
    outline: none;
    cursor: pointer;
  }
  .sort-select:focus { border-color: var(--accent); }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  .nav-stats {
    font-family: 'Space Mono', monospace;
    font-size: .72rem;
    color: white;
    display: flex;
    align-items: center;
    gap: .3rem;
    white-space: nowrap;
    border: 1px solid var(--border);
    padding: .2rem .6rem;
    border-radius: 999px;
  }
  .nav-stats i { font-size: .7rem; }
  .stat-sep { color: var(--border); }

  /* ── Navbar ── */
  .navbar {
    background: rgba(10,10,15,.92) !important;
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1rem;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  .navbar-brand {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: .05em;
    color: var(--accent) !important;
  }
  .nav-link { color: var(--muted) !important; font-size: .85rem; transition: color .2s; }
  .nav-link:hover { color: var(--text) !important; }
  .nav-link.active { color: var(--accent) !important; }
  .logout-button { border: 0; background: none; cursor: pointer; }

  /* ── Search bar ── */
  .search-wrap {
    padding: .75rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: .5rem;
    align-items: center;
  }
  .search-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: .45rem .9rem;
    border-radius: 8px;
    font-size: .88rem;
    outline: none;
    transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .count-badge {
    font-family: 'Space Mono', monospace;
    font-size: .75rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .folder-controls { display: flex; align-items: center; gap: .5rem; }
  #breadcrumbs {
    display: flex; flex-wrap: wrap; align-items: center; gap: .35rem;
    padding: .65rem 1rem 0; font-size: .8rem; color: var(--muted);
  }
  #breadcrumbs[hidden] { display: none; }
  #breadcrumbs button {
    border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0;
  }
  .folder-path { font-size: .65rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder-actions { display: flex; justify-content: space-between; align-items: center; gap: .25rem; margin-top: .4rem; }
  .folder-actions button {
    background: rgba(124,106,247,.15); color: var(--accent); border: 1px solid rgba(124,106,247,.35);
    border-radius: 6px; padding: .2rem .35rem; font-size: .68rem; cursor: pointer;
  }
  @media (max-width: 700px) {
    .search-wrap { flex-wrap: wrap; }
    .search-input { flex-basis: 100%; }
    .folder-controls { width: 100%; justify-content: flex-end; }
  }

  /* ── Folder grid ── */
  #folderGrid {
    display: grid;
    gap: var(--gap);
    padding: var(--gap);
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  @media (max-width: 480px) {
    #folderGrid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }

  /* ── Folder card ── */
  .folder-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s, border-color .2s, box-shadow .2s;
    position: relative;
  }
  .folder-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 6px 24px rgba(124,106,247,.2);
  }
  .folder-thumb {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--border);
    transition: filter .25s;
  }
  .folder-card:hover .folder-thumb { filter: brightness(.75); }
  .folder-info {
    padding: .5rem .6rem;
    border-top: 1px solid var(--border);
  }
  .folder-count {
    font-size: .7rem;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: .3rem;
  }
  .folder-tags {
    margin-top: .3rem;
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .tag-pill {
    font-size: .6rem;
    font-family: 'Space Mono', monospace;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(124,106,247,.15);
    color: var(--accent);
    border: 1px solid rgba(124,106,247,.2);
    white-space: nowrap;
  }

  /* Skeleton */
  .skel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .skel-thumb {
    width: 100%; aspect-ratio: 1;
    background: linear-gradient(90deg, var(--surface) 25%, #1e1e2e 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  .skel-line {
    height: 12px; margin: .5rem .6rem;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface) 25%, #1e1e2e 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* ── Folder modal ── */
  #folderModal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.88);
    z-index: 9999;
    backdrop-filter: blur(6px);
    flex-direction: column;
    overflow: hidden;
  }
  #folderModal.open { display: flex; }

  .modal-header-bar {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .75rem 1rem;
    background: rgba(10,10,15,.95);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-header-bar .sort-select {
    margin-left: auto;
    flex-shrink: 0;
  }
  .modal-header-bar h5 {
    font-family: 'Space Mono', monospace;
    font-size: .9rem;
    color: var(--text);
    margin: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-close-modal {
    background: rgba(255,255,255,.08);
    border: none;
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-close-modal:hover { background: rgba(255,255,255,.16); }

  #modalGrid {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: var(--gap);
    display: grid;
    gap: var(--gap);
    grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 20vw, 300px), 1fr));/*columns width*/
    max-width: 100%;
    align-content: start;
  }

  .modal-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .2s, filter .2s;
    display: block;
    background: var(--border);
  }
  .modal-img:hover { transform: scale(1.04); filter: brightness(.8); }

  .fade-in { animation: fadeIn .3s ease forwards; }
  @keyframes fadeIn { from { opacity:0; transform: scale(.97); } to { opacity:1; transform: none; } }

  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
  .empty-state i { font-size: 3rem; display: block; margin-bottom: 1rem; color: var(--border); }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="d-flex align-items-center w-100 gap-3">
    <span class="navbar-brand"><i class="bi bi-grid-3x3-gap-fill me-2"></i>PixVault</span>
    <a href="/" class="nav-link ms-auto">Gallery</a>
    <a href="/folders" class="nav-link active">Folders</a>
    <a href="/admin" class="nav-link">Admin</a>
    <form method="post" action="/logout"><button class="nav-link logout-button" type="submit">Logout</button></form>
    <span class="nav-stats" id="navStats" title="Unique visitors / Total visits">
      <i class="bi bi-eye"></i> <span id="statUnique">—</span>
      <span class="stat-sep">·</span>
      <i class="bi bi-bar-chart"></i> <span id="statCumul">—</span>
    </span>
  </div>
</nav>

<!-- Search -->
<div class="search-wrap">
  <input type="search" class="search-input" id="searchInput" placeholder="Search folders">
  <div class="folder-controls">
  <select id="viewModeSelect" class="sort-select" aria-label="Folder view mode">
    <option value="flat">All folders</option>
    <option value="tree">Browse folders</option>
  </select>
  <span class="count-badge" id="countBadge">—</span>
  <select id="folderSortSelect" class="sort-select">
    <option value="default">Default</option>
    <option value="hot">🔥 Hot</option>
    <option value="newest">Newest first</option>
    <option value="oldest">Oldest first</option>
    <option value="most">Most photos</option>
    <option value="least">Least photos</option>
    <option value="az">A → Z</option>
    <option value="za">Z → A</option>
  </select>
  </div>
</div>

<div id="breadcrumbs" aria-label="Folder path" hidden></div>

<!-- Folder grid -->
<div id="folderGrid">
  <!-- skeleton placeholders -->
  <div id="skelWrap">
    <script>
      for(let i=0;i<24;i++) document.write(`
        <div class="skel-card">
          <div class="skel-thumb"></div>
          <div class="skel-line" style="width:70%"></div>
          <div class="skel-line" style="width:40%;margin-top:4px"></div>
        </div>`);
    </script>
  </div>
</div>

<!-- Folder image modal -->
<div id="folderModal">
  <div class="modal-header-bar">
  <button class="btn-close-modal" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
    <h5 id="modalTitle" style="margin:0">Folder</h5>
    <span style="font-size:.75rem;color:var(--muted)" id="modalCount"></span>
  </div>
  <select id="modalSortSelect" class="sort-select" style="flex-shrink:0;background:#333;color:white;border:1px solid #666">
    <option value="">Default</option>
    <option value="hot">🔥 Hot</option>
    <option value="newest">Newest first</option>
    <option value="oldest">Oldest first</option>
  </select>
  </div>
  <div id="modalGrid" data-popupable-group="folder-images" data-popupable-looping data-popupable-counter>
    <div id="modalSentinel" style="height:40px;display:flex;align-items:center;justify-content:center;grid-column:1/-1">
      <div class="spinner-border spinner-border-sm text-secondary"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/popupable@1.11.0/dist/popupable.min.js"></script>
<script>
let allFolders = [];
let hotFolders = [];
let currentPath = new URLSearchParams(window.location.search).get('folder') || '';
let visibleChildCounts = new Map();
function migrateFolderCookie(name, validValues) {
  const prefix = `${name}=`;
  const entry = document.cookie.split(';').map(part => part.trim()).find(part => part.startsWith(prefix));
  if (entry) {
    const value = entry.slice(prefix.length);
    if (validValues.includes(value)) localStorage.setItem(name, value);
    document.cookie = `${name}=; Max-Age=0; Path=/folders; SameSite=Lax`;
  }
}
migrateFolderCookie('pixvault-folder-mode', ['flat', 'tree']);
migrateFolderCookie('pixvault-folder-sort', ['default', 'hot', 'newest', 'oldest', 'most', 'least', 'az', 'za']);
let viewMode = (currentPath || localStorage.getItem('pixvault-folder-mode') === 'tree') ? 'tree' : 'flat';
let hotRequestId = 0;
document.getElementById('viewModeSelect').value = viewMode;
const savedFolderSort = localStorage.getItem('pixvault-folder-sort');
if (['default', 'hot', 'newest', 'oldest', 'most', 'least', 'az', 'za'].includes(savedFolderSort)) {
  document.getElementById('folderSortSelect').value = savedFolderSort;
}
function folderUrl(path) {
  const url = new URL(window.location.href);
  if (path) url.searchParams.set('folder', path);
  else url.searchParams.delete('folder');
  return url;
}
function folderHistoryState(extra = {}) {
  return { pixvaultFolder: true, folderMode: viewMode, folderPath: currentPath, overlay: '', ...extra };
}
history.replaceState(folderHistoryState(), '', folderUrl(currentPath));
function navigateFolder(path) {
  if (path === currentPath) return;
  const previousFolderPath = currentPath;
  currentPath = path;
  history.pushState(folderHistoryState({ previousFolderPath }), '', folderUrl(path));
  refreshFolders();
}
function imageSortFromFolderSort(mode) {
  return ['hot', 'newest', 'oldest'].includes(mode) ? mode : '';
}
let modalSort = imageSortFromFolderSort(document.getElementById('folderSortSelect').value);
document.getElementById('modalSortSelect').value = modalSort;
let modalAbortController = null;
document.getElementById('modalSortSelect').addEventListener('change', function() {
  if (modalAbortController) modalAbortController.abort();
  modalLoading = false;
  modalSort = this.value;
  const folderSort = modalSort || 'default';
  document.getElementById('folderSortSelect').value = folderSort;
  localStorage.setItem('pixvault-folder-sort', folderSort);
  applyFolderSort();
  modalPage = 1;
  modalHasMore = true;
  modalItems = [];
  document.getElementById('modalGrid').innerHTML = '<div id="modalSentinel" style="height:40px;display:flex;align-items:center;justify-content:center;grid-column:1/-1"><div class="spinner-border spinner-border-sm text-secondary"></div></div>';
  modalObserver.disconnect();
  //setTimeout(() => modalObserver.observe(document.getElementById('modalSentinel')), 100);
  loadModalPage();
});
function sortFolders(folders, mode) {
  const f = [...folders];
  if (mode === 'newest') f.sort((a, b) => (b.mtime_latest || 0) - (a.mtime_latest || 0));
  else if (mode === 'oldest') f.sort((a, b) => (a.mtime_earliest || 0) - (b.mtime_earliest || 0));
  else if (mode === 'most') f.sort((a, b) => (viewMode === 'tree' ? b.total_count - a.total_count : b.count - a.count));
  else if (mode === 'least') f.sort((a, b) => (viewMode === 'tree' ? a.total_count - b.total_count : a.count - b.count));
  else if (mode === 'az') f.sort((a, b) => (a.display_name||a.name).localeCompare(b.display_name||b.name));
  else if (mode === 'za') f.sort((a, b) => (b.display_name||b.name).localeCompare(a.display_name||a.name));
  return f;
}

async function applyFolderSort() {
  const requestId = ++hotRequestId;
  if (document.getElementById('folderSortSelect').value === 'hot') {
    try {
      const res = await fetch('/api/folders?include_parents=true&sort=hot');
      if (!res.ok) throw new Error('Could not load hot folders');
      const folders = await res.json();
      if (requestId !== hotRequestId) return;
      hotFolders = folders;
    } catch (e) { console.error(e); hotFolders = []; }
  }
  refreshFolders();
}
document.getElementById('folderSortSelect').addEventListener('change', function() {
  localStorage.setItem('pixvault-folder-sort', this.value);
  modalSort = imageSortFromFolderSort(this.value);
  document.getElementById('modalSortSelect').value = modalSort;
  applyFolderSort();
});
document.getElementById('viewModeSelect').addEventListener('change', function() {
  viewMode = this.value;
  localStorage.setItem('pixvault-folder-mode', viewMode);
  currentPath = '';
  history.pushState(folderHistoryState(), '', folderUrl(''));
  refreshFolders();
});

// ── Load folders ──────────────────────────────────────────────────────────
async function loadFolders() {
  try {
    const res = await fetch('/api/folders?include_parents=true');
    if (!res.ok) throw new Error('Could not load folders');
    allFolders = await res.json();
    document.getElementById('skelWrap').remove();
    if (document.getElementById('folderSortSelect').value === 'hot') await applyFolderSort();
    else refreshFolders();
  } catch(e) {
    console.error(e);
    document.getElementById('folderGrid').innerHTML =
      `<div class="empty-state" style="grid-column:1/-1">
        <i class="bi bi-exclamation-circle"></i>
        <p>Could not load folders. Is the server running?</p>
      </div>`;
  }
}

function refreshFolders() {
  const source = document.getElementById('folderSortSelect').value === 'hot' ? hotFolders : allFolders;
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const matches = f => !q || f.name.toLowerCase().includes(q) ||
    f.display_name.toLowerCase().includes(q) || f.tags.some(t => t.toLowerCase().includes(q));
  let folders;
  if (viewMode === 'flat') {
    folders = source.filter(f => f.count > 0 && matches(f));
  } else {
    const visible = new Set();
    const matched = new Set(source.filter(matches).map(f => f.name));
    for (const f of source) {
      let path = f.name;
      while (path) {
        if (matched.has(path)) { visible.add(f.name); break; }
        path = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
      }
    }
    source.filter(f => matched.has(f.name)).forEach(f => {
      let parent = f.parent;
      while (parent) {
        visible.add(parent);
        parent = parent.includes('/') ? parent.slice(0, parent.lastIndexOf('/')) : '';
      }
    });
    visibleChildCounts = new Map();
    source.filter(f => visible.has(f.name)).forEach(f => {
      visibleChildCounts.set(f.parent, (visibleChildCounts.get(f.parent) || 0) + 1);
    });
    if (currentPath && allFolders.length && !allFolders.some(f => f.name === currentPath)) {
      currentPath = '';
      history.replaceState(folderHistoryState(), '', folderUrl(''));
    }
    folders = source.filter(f => f.parent === currentPath && visible.has(f.name));
  }
  const mode = document.getElementById('folderSortSelect').value;
  renderFolders(mode === 'hot' ? folders : sortFolders(folders, mode));
  updateCount(folders.length);
  renderBreadcrumbs();
}

function renderBreadcrumbs() {
  const bar = document.getElementById('breadcrumbs');
  bar.replaceChildren();
  bar.hidden = viewMode !== 'tree';
  if (viewMode !== 'tree') return;
  const root = document.createElement('button');
  root.textContent = 'Gallery';
  root.onclick = () => navigateFolder('');
  bar.appendChild(root);
  let path = '';
  for (const part of currentPath.split('/').filter(Boolean)) {
    path = path ? path + '/' + part : part;
    const separator = document.createElement('span');
    separator.textContent = '/';
    bar.appendChild(separator);
    const crumb = document.createElement('button');
    crumb.textContent = allFolders.find(f => f.name === path)?.display_name || part;
    const target = path;
    crumb.onclick = () => navigateFolder(target);
    bar.appendChild(crumb);
  }
}

function renderFolders(folders) {
  const grid = document.getElementById('folderGrid');
  grid.replaceChildren();

  if (folders.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <i class="bi bi-folder-x"></i><p>No folders found</p></div>`;
    return;
  }

  folders.forEach(f => {
    const childrenInView = viewMode === 'tree' ? (visibleChildCounts.get(f.name) || 0) : 0;
    const card = document.createElement('div');
    card.className = 'folder-card fade-in';
    card.setAttribute('role', 'button');
    card.tabIndex = 0;
    const activate = () => {
      if (viewMode === 'tree' && childrenInView > 0) {
        navigateFolder(f.name);
      } else if (f.count > 0) {
        openFolder(f.name, f.display_name || f.basename);
      }
    };
    card.onclick = activate;
    card.onkeydown = e => { if (e.target === card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); activate(); } };

    const img = document.createElement('img');
    img.className = 'folder-thumb';
    img.src = f.thumbnail;
    img.alt = f.name;
    //img.loading = 'lazy';
    img.loading = 'lazy';
    img.decoding = 'async';

    const info = document.createElement('div');
    info.className = 'folder-info';

    const displayName = f.display_name || f.basename;
    const title = document.createElement('div');
    title.style.cssText = 'font-size:.8rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    title.title = displayName;
    title.textContent = displayName;
    info.appendChild(title);
    if (viewMode === 'flat' && f.parent) {
      const path = document.createElement('div');
      path.className = 'folder-path';
      path.title = f.name;
      path.textContent = f.parent;
      info.appendChild(path);
    }
    const count = document.createElement('div');
    count.className = 'folder-count';
    count.textContent = `${viewMode === 'tree' ? f.total_count : f.count} photos`;
    info.appendChild(count);
    if (viewMode === 'tree') {
      const actions = document.createElement('div');
      actions.className = 'folder-actions';
      const children = document.createElement('span');
      children.textContent = childrenInView ? `${childrenInView} folders` : '';
      actions.appendChild(children);
      if (f.count > 0 && childrenInView > 0) {
        const view = document.createElement('button');
        view.textContent = `View ${f.count} photos`;
        view.onclick = e => { e.stopPropagation(); openFolder(f.name, displayName); };
        actions.appendChild(view);
      }
      info.appendChild(actions);
    }
    const tags = document.createElement('div');
    tags.className = 'folder-tags';
    f.tags.slice(0,3).forEach(tag => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill';
      pill.textContent = tag;
      tags.appendChild(pill);
    });
    info.appendChild(tags);

    card.appendChild(img);
    card.appendChild(info);
    grid.appendChild(card);
  });
}

function updateCount(n) {
  document.getElementById('countBadge').textContent = `${n.toLocaleString()} folder${n!==1?'s':''}`;
}

// ── Search ────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
  refreshFolders();
});

// ── Folder modal ──────────────────────────────────────────────────────────
let modalPage = 1;
let modalHasMore = true;
let modalLoading = false;
let modalFolder = '';
let modalItems = [];
let activePopupSource = null;
let activePopupElement = null;
let popupClosingFromHistory = false;

function dismissPopup() {
  (activePopupElement || document).dispatchEvent(new KeyboardEvent('keydown', {
    key: 'Escape', code: 'Escape', bubbles: true, cancelable: true,
  }));
}

async function openFolder(name, displayName, recordHistory = true) {
  // log folder visit
  if (recordHistory) fetch('/api/hot/folder?name=' + encodeURIComponent(name), { method: 'POST' });
  modalFolder = name;
  modalPage = 1;
  modalHasMore = true;
  modalItems = [];
  modalSort = imageSortFromFolderSort(document.getElementById('folderSortSelect').value);
  document.getElementById('modalSortSelect').value = modalSort;
  const grid = document.getElementById('modalGrid');
  grid.innerHTML = '<div id="modalSentinel" style="height:40px;display:flex;align-items:center;justify-content:center;grid-column:1/-1"><div class="spinner-border spinner-border-sm text-secondary"></div></div>';
  modalObserver.disconnect();
  document.getElementById('modalTitle').textContent = displayName || name;
  document.getElementById('modalCount').textContent = '';
  document.getElementById('folderModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (recordHistory) {
    history.pushState(folderHistoryState({ overlay: 'modal', modalFolder: name, modalDisplayName: displayName }), '', folderUrl(currentPath));
  }
  await loadModalPage();
}

async function loadModalPage() {
  if (modalLoading || !modalHasMore) return;
  modalLoading = true;
  document.getElementById('modalSentinel').style.display = 'flex';
  modalAbortController = new AbortController();
  try {
    const path = modalFolder.split('/').map(encodeURIComponent).join('/');
    const res = await fetch(`/api/folder/${path}?page=${modalPage}&per_page=20&sort=${modalSort||''}`, { signal: modalAbortController.signal });
    if (!res.ok) throw new Error('Could not load folder images');
    const data = await res.json();
    modalHasMore = data.has_more;
    modalPage++;
    document.getElementById('modalCount').textContent = `${data.total.toLocaleString()} photos`;

    const sentinel = document.getElementById('modalSentinel');
    data.items.forEach(item => {
      modalItems.push(item);
      const img = document.createElement('img');
      img.className = 'modal-img fade-in';
      img.src = item.thumb_url || item.url;
      img.dataset.popupable = '';
      img.dataset.popupableSrc = item.url;
      img.dataset.popupableThumb = item.thumb_url || item.url;
      img.dataset.popupableDescription = item.display_name || item.folder;
      img.dataset.popupableGroup = 'folder-images';
      img.alt = item.folder;
      img.loading = 'lazy';
      img.dataset.idx = modalItems.length - 1;
      document.getElementById('modalGrid').insertBefore(img, sentinel);
    });

    if (!modalHasMore) {
      if (sentinel) sentinel.style.display = 'none';
    } else if (sentinel) {
      document.getElementById('modalGrid').appendChild(sentinel);
      modalObserver.disconnect();
      setTimeout(() => modalObserver.observe(sentinel), 300);
    }
  } catch(e) {
    if (e.name !== 'AbortError') console.error(e);
  } finally { modalLoading = false; }
}

const modalObserver = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && !modalLoading && modalHasMore) loadModalPage();
}, { root: document.getElementById('modalGrid'), rootMargin: '300px' });

document.getElementById('modalGrid').addEventListener('scroll', () => {
  const grid = document.getElementById('modalGrid');
  if (!modalLoading && modalHasMore && grid.scrollTop + grid.clientHeight >= grid.scrollHeight - 800) {
    loadModalPage();
  }
}, { passive: true });
function hideModal() {
  if (modalAbortController) modalAbortController.abort();
  modalObserver.disconnect();
  modalLoading = false;
  modalHasMore = false;
  document.getElementById('folderModal').classList.remove('open');
  document.getElementById('modalGrid').innerHTML = '';
  document.body.style.overflow = '';
}

function closeModal() {
  if (history.state?.pixvaultFolder && history.state.overlay === 'modal') history.back();
  else hideModal();
}

window.addEventListener('popstate', event => {
  const state = event.state?.pixvaultFolder ? event.state : null;
  let overlay = state?.overlay || '';
  if (activePopupSource && overlay !== 'popup') {
    popupClosingFromHistory = true;
    dismissPopup();
  }
  if (document.getElementById('folderModal').classList.contains('open') && overlay !== 'modal' && overlay !== 'popup') {
    hideModal();
  }
  viewMode = state?.folderMode || (new URLSearchParams(window.location.search).has('folder') ? 'tree' : viewMode);
  currentPath = viewMode === 'tree' ? (state?.folderPath || new URLSearchParams(window.location.search).get('folder') || '') : '';
  document.getElementById('viewModeSelect').value = viewMode;
  localStorage.setItem('pixvault-folder-mode', viewMode);
  refreshFolders();
  if (overlay === 'popup' && !activePopupSource) {
    overlay = 'modal';
    history.replaceState({ ...state, overlay }, '', folderUrl(currentPath));
  }
  if ((overlay === 'modal' || overlay === 'popup') && !document.getElementById('folderModal').classList.contains('open') && state?.modalFolder) {
    openFolder(state.modalFolder, state.modalDisplayName, false);
  }
});

document.getElementById('folderModal').addEventListener('click', e => {
  if (e.target === document.getElementById('folderModal')) closeModal();
});

document.addEventListener('popupable:open', e => {
  const wasOpen = Boolean(activePopupSource);
  activePopupSource = e.target;
  activePopupElement = e.detail.popup;
  if (!wasOpen) {
    history.pushState(folderHistoryState({ overlay: 'popup', modalFolder, modalDisplayName: document.getElementById('modalTitle').textContent }), '', folderUrl(currentPath));
  }
  const idx = Number(e.target.dataset.idx);
  const item = modalItems[idx];
  if (item) fetch('/api/hot/image?url=' + encodeURIComponent(item.url), { method: 'POST' });
});
document.addEventListener('popupable:close', () => {
  activePopupSource = null;
  activePopupElement = null;
  if (popupClosingFromHistory) { popupClosingFromHistory = false; return; }
  if (history.state?.pixvaultFolder && history.state.overlay === 'popup') history.back();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.defaultPrevented || activePopupSource || history.state?.overlay === 'popup') return;
  if (document.getElementById('folderModal').classList.contains('open')) {
    e.preventDefault();
    closeModal();
    return;
  }
  if (viewMode !== 'tree' || !currentPath) return;
  e.preventDefault();
  const parent = currentPath.includes('/') ? currentPath.slice(0, currentPath.lastIndexOf('/')) : '';
  if (history.state?.previousFolderPath === parent && history.state.overlay === '') history.back();
  else navigateFolder(parent);
});

// ── Init ──────────────────────────────────────────────────────────────────
loadFolders();

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const d = await res.json();
    document.getElementById('statUnique').textContent = d.unique.toLocaleString();
    document.getElementById('statCumul').textContent  = d.cumulative.toLocaleString();
  } catch(e) {}
}
loadStats();
</script>
